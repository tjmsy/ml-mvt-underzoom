<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ml-mvt-underzoom demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="panel">
      <h1>ml-mvt-underzoom demo</h1>
      <p>
        GSI optimal_bvmap PMTiles (z16 source) displayed at z15 via
        <code>mvt-underzoom://</code>. Debug colors (not production style).
      </p>
      <ul class="legend">
        <li><span class="swatch rdedg"></span>RdEdg (road edge)</li>
        <li><span class="swatch rdcompt"></span>RdCompt (all vt_code; demo shows full layer)</li>
      </ul>
      <label class="toggle">
        <input type="checkbox" id="dim-basemap" checked />
        Dim background map (easier to see overlay)
      </label>
      <p id="status">loading…</p>
    </div>
    <div id="map"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
